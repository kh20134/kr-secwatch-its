# https://fly.io/docs/reference/configuration/

app = "kr-secwatch-its"
primary_region = "nrt"

[build]

[env]
  SECWATCH_DEMO = "1"
  SECWATCH_DB = "/tmp/demo.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
